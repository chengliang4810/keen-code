[package]
name = "rcode-plugins"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false
description = "RCode 插件清单、依赖、受控安装与运行时组件"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rcode-agent = { path = "../agent" }
rcode-model = { path = "../model" }
rcode-skills = { path = "../skills" }
rcode-tools = { path = "../tools" }
tokio = { version = "1", features = ["rt"] }
