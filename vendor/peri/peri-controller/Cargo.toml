[package]
name = "peri-controller"
version.workspace = true
edition.workspace = true
description = "Controller layer — control plane (lite params / run Session / cancel forward / event pop)"

[dependencies]
peri-acp-types = { path = "../peri-acp-types" }
# 层依赖（§0 依赖规则）：Controller → Runtime（run Session / cancel 定位转发）、
# Controller → Resources（pick Resources）均为声明边。
peri-runtime = { path = "../peri-runtime" }
peri-resources = { path = "../peri-resources" }
# Controller 公开的工具定义来自 Agent 契约层；这不是观测依赖。
peri-agent = { path = "../peri-agent" }
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
tracing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
anyhow.workspace = true
async-trait.workspace = true
serial_test.workspace = true
tempfile.workspace = true
