[package]
name = "peri-agent"
version.workspace = true
edition.workspace = true
description = "Rust Agent framework with middleware system, aligned with @langgraph-js/standard-agent"
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs-next.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio-util.workspace = true
sqlx = { workspace = true }
parking_lot.workspace = true
peri-model = { path = "../peri-model" }
peri-acp-types = { path = "../peri-acp-types" }
peri-resources = { path = "../peri-resources" }
sysinfo.workspace = true
fuzzy-matcher = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS PATH 探测需要将 ChildStdout 设为非阻塞，避免阻塞 reader 线程无法有界回收。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows Job Object 用于在 Bash future 取消时原子终止整个子进程树。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true
url.workspace = true
