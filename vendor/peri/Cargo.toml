[workspace]
members = [
    "peri-acp",
    "peri-acp-types",
    "peri-agent",
    "peri-controller",
    "peri-middlewares",
    "peri-model",
    "peri-resources",
    "peri-runtime",
    "peri-lsp",
    # 为跨 crate 测试提供共享 fixture 和辅助工具。
    "peri-test-support",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
# NOTE: "symbols" not "true" — Apple strip doesn't behave like GNU strip.
#       "true" on macOS only strips debug info, leaving 8MB of symbol table.
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1

# ============================================================================
# Workspace-wide dependency declarations
# Single source of truth — all crates reference via `workspace = true`.
# ============================================================================

[workspace.dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# --- Serde ecosystem ---
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

# --- HTTP ---
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- Error handling ---
anyhow = "1.0"
thiserror = "2.0"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "v7", "serde"] }
parking_lot = "0.12"
dirs-next = "2"
url = "2"
# Marketplace 缓存键使用稳定 SHA-256，避免超长路径组件和命名域碰撞。
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
sysinfo = "0.39"
lsp-types = "0.97"
lru = "0.18"

# --- Build ---
tempfile = "3"

# --- Allocator ---
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats", "use_std"] }
tikv-jemalloc-sys = "0.6"

clap = { version = "4", features = ["derive", "env"] }
semver = "1"

# --- PTY server ---
axum = { version = "0.8.9", features = ["ws"] }
# LSP 子进程生命周期：Unix 独立进程组、Windows Job Object 与 Tokio child wrapper。
process-wrap = { version = "9.1.0", default-features = false, features = [
    "tokio1",
    "job-object",
    "kill-on-drop",
    "process-group",
] }
# 0.9.0：历史 pin（0.8.1）因 Windows ConPTY reader 短命令场景 bug 而设；
# 2026-08-12 Batch 2b 解除 pin 升级后 Windows CI 上 3 个 pty_session 读取测试
# 失败。排查确认 0.8.1/0.9.0 的 Windows 实现（conpty.rs）完全一致，失败与
# 版本无关，实为 PowerShell 5.1 在 ConPTY 下的输出编码/交互行为问题——
# 测试已改用 cmd.exe（纯字节流）规避，重新升级回 0.9.0 验证。
# 详见 docs/review/2026-06-16-peri-web-pty-windows-conpty-bug.md
portable-pty = "0.9"
tokio-tungstenite = "0.30"
serial_test = "4.0.1"
