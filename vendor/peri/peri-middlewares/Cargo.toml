[package]
name = "peri-middlewares"
version.workspace = true
edition.workspace = true
description = "Rust Agent middleware implementations, aligned with @langgraph-js/agent-middlewares"
license = "Apache-2.0"

[dependencies]
peri-agent = { path = "../peri-agent" }
peri-acp-types = { path = "../peri-acp-types" }
peri-model = { path = "../peri-model" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["process"] }
# P5.1: SubAgent stub 需要 tokio_util::sync::CancellationToken（原 v1 AgentCancellationToken 别名）。
# 与 peri-agent 共享同一 tokio-util 依赖（feature unification 自动合并 sync feature）。
tokio-util = { workspace = true }
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
gray_matter = "0.3"
dirs-next.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
croner = "3"
tracing.workspace = true
parking_lot.workspace = true
grep = "0.4"
rmcp = { version = "3.1.2", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
# MCP stdio 子进程需要独立进程组/Job Object，确保关闭连接时清理整个进程树。
process-wrap = { workspace = true }
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
url.workspace = true
regex = "1"
flate2 = "1"
tar = "0.4"
# 缓存键超出 Windows 单组件上限时需要稳定、带域分离的 SHA-256。
sha2.workspace = true
# 用于 NPM 取得目录的独占创建与 RAII 清理，避免失败路径残留临时文件。
tempfile.workspace = true

shellexpand = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = { version = "0.23.1", features = ["alloc"] }
ipnet = "2.10"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
peri-resources = { path = "../peri-resources" }
lsp-types.workspace = true


[dev-dependencies]
tempfile.workspace = true
filetime = "0.2"
# 测试专用 Rust LSP 子进程 fixture；不进入生产依赖图。
peri-test-support = { path = "../peri-test-support" }
