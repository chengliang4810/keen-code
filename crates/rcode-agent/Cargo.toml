[package]
name = "rcode-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[lib]
name = "rcode_agent"
path = "src/lib.rs"

[dependencies]
# Provider 中立模型请求、响应和工具消息。
rcode-model = { path = "../rcode-model" }
# 组合流式模型、取消与只读工具并发。
futures-util = "0.3.31"
# 规范化工具输入与错误内容。
serde_json = "1.0.143"
# 序列化 Todo、Goal 与 Plan 的 Provider 中立状态快照。
serde = { version = "1.0.219", features = ["derive"] }
# 生成规范化工具输入与协作恢复记录的固定长度摘要。
sha2 = "0.10.9"
# 提供可克隆、可等待且不会依赖桌面层的取消令牌。
tokio-util = { version = "0.7.16", features = ["rt"] }
# 在取消后给工具一个有界的进程树清理窗口，并为协作 mailbox 提供无轮询唤醒。
tokio = { version = "1.47.1", features = ["rt", "sync", "time"] }
# 为持久 Goal 生成按时间排序且跨进程唯一的标识。
uuid = { version = "1.18.1", features = ["v7"] }
# 在模型轮次用量提交时输出缓存命中率等结构化观测日志，由桌面层订阅器落盘。
tracing = "0.1"

[dev-dependencies]
# 运行异步 Agent Loop，并用暂停时钟确定性验证等待超时。
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
