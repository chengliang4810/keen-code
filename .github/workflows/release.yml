name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: corepack pnpm@10.14.0 install --frozen-lockfile
      # 后续检查分别验证核心 workspace 和 Tauri 桌面 crate。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Tauri 2 的 Linux target 会编译 GTK、WebKitGTK 和 Ayatana AppIndicator。
      # patchelf 也一并固定，避免后续 Linux bundle 或构建脚本缺少原生工具。
      - name: 安装 Tauri Linux 原生依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: CSS lint
        run: corepack pnpm@10.14.0 lint:css
      - run: corepack pnpm@10.14.0 typecheck
      - run: corepack pnpm@10.14.0 test
      - run: corepack pnpm@10.14.0 build

      - name: Rust workspace format
        run: cargo fmt --all -- --check
      - name: Rust workspace check
        run: cargo check --workspace --all-targets
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tauri crate format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Tauri crate check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Tauri crate tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Tauri crate clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_draft: ${{ steps.release_state.outputs.release_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute immutable release versions
        id: version
        env:
          KEENCODE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/release-version.mjs

      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Detect an existing release on workflow reruns
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "release_draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_draft=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs:
      - verify
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            asset_label: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            asset_label: x64
          - platform: windows-latest
            target: ""
            args: ""
            asset_label: windows_x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: corepack pnpm@10.14.0 install --frozen-lockfile

      - name: Write release-only Tauri config
        shell: bash
        run: >-
          node scripts/release-version.mjs --write-tauri-config
          .github/tauri.release.conf.json
          "${{ needs.prepare.outputs.app_version }}"

      - name: Build and upload signed installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEENCODE_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseBody: |
            本版本由 main 分支自动构建，包含 Windows x64、macOS Apple Silicon 与 macOS Intel 安装包。

            应用内更新使用签名清单和签名安装包进行校验。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: KeenCode_${{ needs.prepare.outputs.tag }}_${{ matrix.asset_label }}[ext]
          args: ${{ matrix.args }} --config .github/tauri.release.conf.json

      # Tauri 构建完成后确认安装包资源目录仍携带完整许可证和第三方 NOTICE。
      - name: 校验安装包许可证资源
        run: node scripts/verify-bundle-resources.mjs --target src-tauri/target

      # 记录每个平台实际生成的文件包摘要，供发布审计和后续下载校验使用。
      - name: 生成安装包 SHA-256 与大小报告
        shell: bash
        env:
          ASSET_LABEL: ${{ matrix.asset_label }}
          BUNDLE_REPORT_PATH: ${{ runner.temp }}/keencode-bundle-${{ matrix.asset_label }}.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, statSync, writeFileSync } from "node:fs";
          import { relative, resolve } from "node:path";
          import { findBundleArtifacts, sha256File } from "./scripts/verify-bundle-resources.mjs";

          const targetRoot = resolve("src-tauri/target");
          const artifacts = findBundleArtifacts(targetRoot).filter(({ path }) => {
            // .app 是未压缩的目录 bundle；Release 上传的是其中的归档或磁盘映像。
            return lstatSync(path).isFile();
          });
          if (artifacts.length === 0) {
            throw new Error(`未在 ${targetRoot} 找到可报告的安装包文件`);
          }

          const reportArtifacts = artifacts.map(({ kind, path }) => ({
            type: kind,
            path,
            sha256: sha256File(path),
            bytes: statSync(path).size,
          }));
          const totalBytes = reportArtifacts.reduce((sum, artifact) => sum + artifact.bytes, 0);
          const report = {
            platform: process.env.RUNNER_OS,
            assetLabel: process.env.ASSET_LABEL,
            targetRoot,
            artifacts: reportArtifacts,
            totalBytes,
          };
          const reportPath = resolve(process.env.BUNDLE_REPORT_PATH);
          writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);

          const markdownRows = reportArtifacts.map((artifact) => {
            const displayPath = relative(process.cwd(), artifact.path).replaceAll("\\", "/");
            return `| ${artifact.type} | \`${displayPath}\` | \`${artifact.sha256}\` | ${artifact.bytes} |`;
          });
          const summary = [
            `## 安装包摘要（${process.env.ASSET_LABEL}）`,
            "",
            "| 类型 | 路径 | SHA-256 | 字节数 |",
            "| --- | --- | --- | ---: |",
            ...markdownRows,
            "",
            `总大小：${totalBytes} 字节（${(totalBytes / 1024 / 1024).toFixed(2)} MiB）`,
            "",
          ].join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: 上传安装包摘要报告
        uses: actions/upload-artifact@v4
        with:
          name: keencode-bundle-report-${{ matrix.asset_label }}
          path: ${{ runner.temp }}/keencode-bundle-${{ matrix.asset_label }}.json
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and annotate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          manifest_dir="$RUNNER_TEMP/keencode-updater"
          mkdir -p "$manifest_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          manifest="$manifest_dir/latest.json"
          assets="$manifest_dir/release-assets.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$assets"
          node scripts/release-version.mjs \
            --finalize-updater-manifest \
            "$manifest" "$RELEASE_TAG" "$assets" "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft=false
          --latest
