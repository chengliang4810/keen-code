name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "确认发布：必须设为 true"
        required: true
        type: boolean
        default: false
      tag:
        description: "已存在的版本 tag，例如 v0.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      pub_date: ${{ steps.resolve.outputs.pub_date }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Validate release trigger
        id: resolve
        shell: bash
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_PUBLISH" != "true" ]]; then
              echo "workflow_dispatch 必须显式将 publish 设置为 true。" >&2
              exit 1
            fi
            tag="$DISPATCH_TAG"
            publish=true
          else
            echo "不支持的发布触发方式：$GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "发布 tag 必须是 vX.Y.Z 格式：$tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "pub_date=$pub_date"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Rust workspace
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            lld \
            llvm \
            pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libvulkan1 \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libssl-dev \
            libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Verify release tag matches desktop Cargo version
        shell: bash
        env:
          KEENCODE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg name 'keencode-desktop' '[.packages[] | select(.name == $name) | .version] | if length == 1 then .[0] else empty end')"
          if [[ -z "$cargo_version" || "$cargo_version" != "$KEENCODE_RELEASE_VERSION" ]]; then
            echo "发布 tag 版本 $KEENCODE_RELEASE_VERSION 与 keencode-desktop Cargo 版本 $cargo_version 不一致。" >&2
            exit 1
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Audit dependencies
        run: cargo deny --log-level info check advisories bans licenses sources

  build:
    name: Build ${{ matrix.label }}
    needs:
      - prepare
      - verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    env:
      KEENCODE_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            lld \
            llvm \
            pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libvulkan1 \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libssl-dev \
            libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build desktop updater binary
        run: cargo build --release --package keencode-desktop --target ${{ matrix.target }}

      - name: Stage bare updater binary
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_LABEL: ${{ matrix.label }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $releaseDirectory = Join-Path "target" $env:BUILD_TARGET
          $releaseDirectory = Join-Path $releaseDirectory "release"
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "keencode-release"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null

          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          $binaryName = "keencode-desktop" + $suffix
          $source = Join-Path $releaseDirectory $binaryName
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "构建产物缺失：$source"
          }

          $assetName = "KeenCode_{0}_{1}{2}" -f $env:RELEASE_TAG, $env:ARTIFACT_LABEL, $suffix
          Copy-Item -LiteralPath $source -Destination (Join-Path $artifactDirectory $assetName)
          Write-Output "已暂存裸更新二进制：$assetName"

      - name: Upload bare updater binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ runner.temp }}/keencode-release
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign updater binaries
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEENCODE_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      KEENCODE_VERSION: ${{ needs.prepare.outputs.version }}
      MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
    steps:
      - name: Install fixed minisign CLI
        run: cargo install minisign --version 0.10.0 --locked

      - name: Download bare updater binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/keencode-release-inputs
          merge-multiple: false

      - name: Sign binaries
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MINISIGN_PRIVATE_KEY//[[:space:]]/}" ]]; then
            echo "MINISIGN_PRIVATE_KEY secret 为空，拒绝继续发布。" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/minisign-private.key"
          input_dir="$RUNNER_TEMP/keencode-release-inputs"
          signed_dir="$RUNNER_TEMP/keencode-release-signed"
          mkdir -p "$signed_dir"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          labels=(
            "windows-x86_64"
            "darwin-aarch64"
            "darwin-x86_64"
            "linux-x86_64"
          )
          for label in "${labels[@]}"; do
            suffix=""
            if [[ "$label" == "windows-x86_64" ]]; then
              suffix=".exe"
            fi
            asset_name="KeenCode_${KEENCODE_RELEASE_TAG}_${label}${suffix}"
            source_path="$(find "$input_dir" -type f -name "$asset_name" -print -quit)"
            if [[ -z "$source_path" ]]; then
              echo "找不到待签名二进制：$asset_name" >&2
              exit 1
            fi
            cp -- "$source_path" "$signed_dir/$asset_name"
            minisign -S -s "$key_path" -m "$signed_dir/$asset_name" \
              -x "$signed_dir/$asset_name.minisig"
          done

          find "$signed_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload signed updater binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: ${{ runner.temp }}/keencode-release-signed
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Generate update manifest
    needs:
      - prepare
      - sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download signed updater binaries
        uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: ${{ runner.temp }}/keencode-release-signed

      - name: Generate latest.json with Rust
        shell: bash
        env:
          KEENCODE_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          KEENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          KEENCODE_PUB_DATE: ${{ needs.prepare.outputs.pub_date }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/keencode-release-signed"
          cargo run --locked --release --package keencode-release -- \
            --version "$KEENCODE_VERSION" \
            --release "$KEENCODE_RELEASE_TAG" \
            --notes "KeenCode $KEENCODE_RELEASE_TAG" \
            --pub-date "$KEENCODE_PUB_DATE" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir "$asset_dir" \
            --output "$asset_dir/latest.json" \
            --artifact "windows-x86_64=KeenCode_${KEENCODE_RELEASE_TAG}_windows-x86_64.exe" \
            --artifact "darwin-aarch64=KeenCode_${KEENCODE_RELEASE_TAG}_darwin-aarch64" \
            --artifact "darwin-x86_64=KeenCode_${KEENCODE_RELEASE_TAG}_darwin-x86_64" \
            --artifact "linux-x86_64=KeenCode_${KEENCODE_RELEASE_TAG}_linux-x86_64"

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/keencode-release-signed/latest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - sign
      - manifest
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed updater binaries
        uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: ${{ runner.temp }}/keencode-release-signed

      - name: Download update manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/keencode-release-manifest

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          signed_dir="$RUNNER_TEMP/keencode-release-signed"
          manifest_path="$RUNNER_TEMP/keencode-release-manifest/latest.json"
          shopt -s nullglob
          assets=("$signed_dir"/*)
          assets+=("$manifest_path")
          if [[ ${#assets[@]} -ne 9 ]]; then
            echo "发布资产数量不符合预期：${#assets[@]}，需要 8 个二进制/签名文件和 latest.json。" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "KeenCode $RELEASE_TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
