name: CI

on:
  push:
  pull_request:

# 普通 CI 只需要读取仓库内容，不授予发布或其他写权限。
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # 与本机当前构建基线和项目依赖要求一致的受支持 Node 主版本。
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: corepack pnpm@10.14.0 install --frozen-lockfile
      - name: Typecheck frontend
        run: corepack pnpm@10.14.0 typecheck
      - name: Test frontend
        run: corepack pnpm@10.14.0 test
      - name: Build frontend
        run: corepack pnpm@10.14.0 build
      - name: Check diff formatting
        run: git diff --check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tauri 的系统能力和 portable-pty 必须在三种受支持平台分别验证。
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          # 统一 workspace 后，核心 crate 与桌面包共享根 target 目录。
          workspaces: . -> target

      # 桌面构建脚本在编译期校验 tauri.conf.json 的 bundle.resources（apps/ui/dist）。
      # 该目录是前端构建产物且被 gitignore，纯 Rust 检查只需保证目录存在。
      - name: Ensure frontend dist placeholder
        run: mkdir -p apps/ui/dist

      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Test workspace doctests
        run: cargo test --workspace --doc
