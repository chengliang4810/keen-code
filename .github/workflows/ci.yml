name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Audit dependencies
        run: cargo deny --log-level info check advisories bans licenses sources

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            lld \
            llvm \
            pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libvulkan1 \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libssl-dev \
            libsqlite3-dev

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            cmake \
            lld \
            llvm \
            pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libvulkan1 \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libssl-dev \
            libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test documentation
        run: cargo test --workspace --doc

      - name: Check diff formatting
        run: git diff --check

  windows-native:
    name: Windows GPUI native build
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build desktop acceptance binary
        run: cargo build -p keencode-desktop --release

      - name: Build native acceptance runner
        run: cargo build -p keencode-native-gpui-tests

      - name: Test native acceptance runner
        run: cargo test -p keencode-native-gpui-tests
