[package]
name = "rcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rcode-cli"
path = "src/main.rs"

[dependencies]
dirs = "7"
serde_json = "1"
rcode-control-protocol = { path = "../../crates/rcode-control-protocol" }
rcode-agent = { path = "../../crates/rcode-agent" }
rcode-model = { path = "../../crates/rcode-model" }
rcode-provider = { path = "../../crates/rcode-provider" }
rcode-runtime = { path = "../../crates/rcode-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
