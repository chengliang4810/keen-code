[package]
# 桌面后端包名。
name = "keencode-desktop"
# 首版应用版本。
version = "0.0.1"
# KeenCode 桌面后端自有代码采用 MIT 许可证。
license = "MIT"
# 使用 Rust 2024 edition。
edition = "2024"
# 原生 Windows 图标和版本资源，不嵌入浏览器或前端包。
build = "build.rs"

[lib]
# 避免库名中的连字符影响 Rust 引用。
name = "keencode_desktop"
# 纯桌面应用仅 bin 通过 rlib 消费本库；不生成移动端模板遗留的 staticlib/cdylib，
# 避免链接期对全依赖图重复执行 LTO。
crate-type = ["rlib"]

[build-dependencies]
# 生成 Windows 原生图标与版本资源。
winresource = "0.1"

[dependencies]
# 统一错误上下文。
anyhow = "1"
# 按需读取持久文件快照时使用当前依赖图已有的标准 Base64 编解码。
base64 = "0.22"
# 提供本地时区的日期换算，并序列化 usage 与记忆记录中的日期时间。
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
# 接入 KeenCode 自有 ACP 协议与事件契约。
keencode-acp = { path = "../../core/acp" }
# 接入 KeenCode 自有 Agent 回合执行核心。
keencode-agent = { path = "../../core/agent" }
# 接入 KeenCode 自有供应商配置与注册表。
keencode-provider = { path = "../../core/provider" }
# 接入 Provider 中立协议、消息与流事件类型。
keencode-model = { path = "../../core/model" }
# 接入 Provider 中立 MCP 客户端及其 stdio、HTTP 运行配置。
keencode-mcp = { path = "../../core/mcp" }
# 接入权威 Session Journal 事件与恢复类型。
keencode-resources = { path = "../../core/resources" }
# 接入 KeenCode 自有 Session 与回合运行时。
keencode-runtime = { path = "../../core/runtime" }
# 接入 KeenCode Skills 的安全发现配置与插件精确根。
keencode-skills = { path = "../../core/skills" }
# 接入 KeenCode 自有本地、协作与状态工具注册。
keencode-tools = { path = "../../core/tools" }
# 在桌面宿主内驱动动态 JSON 工作流，复用 Agent 与 Journal。
keencode-workflow = { path = "../../core/workflow" }
# 查询自定义供应商的标准模型目录。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# Hook matcher 使用依赖图已有的 Rust 正则引擎。
regex = "1"
# task-groups.json 的变更事务需要跨桌面进程文件锁，避免冷重启竞态回写旧分组。
fs2 = "0.4"
# 使用 Croner 严格解析五字段 cron，并按当前本地时区计算下一次触发时间。
croner = "=3.0.1"
# 复用工具运行时已有的 ignore 版本，保证原文件搜索尊重 Git 忽略规则；不引入外部 rg 进程。
ignore = "0.4"
# 序列化本地状态与 ACP 参数。
serde = { version = "1", features = ["derive"] }
# 读取 Session 状态和 KeenCode 本地配置。
serde_json = "1"
# 校验后台下载缓存从 minisign 验签到安装之间未被改写。
minisign-verify = "0.3"
sha2 = "0.10"
# 纯 Rust 处理 npm/PyPI 与 HTTP 插件归档；不执行安装脚本或依赖 Node/Python。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# UI 与平台共享固定 GPUI 提交；不混用 crates.io 的旧 Entity ABI。
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit"] }
# 读取 GPUI 提供的原生窗口句柄，将系统托盘绑定到真实主窗口；复用已有 ABI 版本。
raw-window-handle = "0.6"
# 固定 94f34c9f8e98b5f4b3078776a4c197b9021f4cdf 的本地副本补齐控件尺寸、
# UIA 语义和减少动画的计时器生命周期；来源与补丁见同目录 SOURCE.md。
ely-gpui-component = { path = "../../third-party/ely-gpui-component" }
futures = "0.3"
log = "0.4"
dirs = "6"
# 使用同目录唯一临时文件完成 Windows/macOS 都可覆盖既有目标的原子写。
tempfile = "3"
# 提供 MCP 初始化状态使用的异步 watch 通道及更新缓存异步读写。
tokio = { version = "1", features = ["sync", "fs", "rt", "rt-multi-thread", "process", "io-util", "time", "macros"] }
# 与纯 Rust 工作流共享可传播到 Agent、工具和进程的取消令牌。
tokio-util = { version = "0.7", features = ["rt"] }
# 复用工具运行时已有版本：后台开发脚本必须在停止/退出时收割整个进程树。
command-group = { version = "5.0.1", features = ["with-tokio"] }
# 校验用户输入的模型 API 地址，并反序列化更新清单中的下载地址。
url = { version = "2", features = ["serde"] }
# 读取第三方 MCPB/DXT ZIP 包；禁用未使用的压缩算法以控制体积。
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# ACP 运行时共享状态。
parking_lot = "0.12"
tracing = "0.1"
# 使用标准订阅器把后台 tracing 错误与异步请求上下文写入本地诊断文件。
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
# 使用系统 PTY 承载内置终端；不随应用打包 shell 或额外运行时。
portable-pty = "=0.8.1"
# 复用 Ely 已锁定的成熟终端网格，正确处理 Unicode 宽度、SGR 属性和备用屏幕。
alacritty_terminal = "=0.26.0"

# 使用平台电源断言或 Linux systemd inhibitor 阻止空闲睡眠。
keepawake = "0.6.0"
# 将插件敏感 userConfig 保存到系统密钥库（Keychain、Credential Manager 或 Secret Service）。
keyring = "=4.1.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# 跨平台原生目录通知；使用系统事件后端，替代 250ms 全量扫盘，不使用 PollWatcher。
notify = "=8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# 通过 Foundation 的进程内系统信息 API 读取 macOS 版本，避免启动外部进程。
objc2-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "NSProcessInfo"] }

[target.'cfg(unix)'.dependencies]
# Linux 使用 XDG/D-Bus、macOS 使用 UserNotifications；通知失败必须返回真实系统错误。
notify-rust = "=4.17.0"

[target.'cfg(target_os = "windows")'.dependencies]
# 从 Windows Internet Settings 读取桌面应用无法从 shell 继承的系统代理。
winreg = "0.55"
# 读取桌面进程树、CPU 时间和内存计数器；仅 Windows 编译。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# 为桌面集成测试暴露资源层的一次性 Journal 追加故障注入点。
keencode-resources = { path = "../../core/resources", features = ["test-support"] }

# 发布参数位于仓库根 Cargo.toml 的 [profile.release]：profile 只在 workspace 根生效。
