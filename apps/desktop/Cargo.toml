[package]
name = "rcode"
version = "0.9.0-beta"
description = "RCode - Rust and Result agent development workbench"
authors = ["RCode contributors"]
license = "MIT"
edition = "2021"
default-run = "rcode"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# macos-private-api backs the transparent window NSVisualEffectView needs.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
rcode-control-protocol = { path = "../../crates/rcode-control-protocol" }
rcode-model = { path = "../../crates/rcode-model" }
rcode-provider = { path = "../../crates/rcode-provider" }
rcode-agent = { path = "../../crates/rcode-agent" }
rcode-runtime = { path = "../../crates/rcode-runtime" }
rcode-mcp = { path = "../../crates/rcode-mcp" }
rcode-skills = { path = "../../crates/rcode-skills" }
rcode-tools = { path = "../../crates/rcode-tools" }
rcode-plugins = { path = "../../crates/rcode-plugins" }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.9"
dirs = "7"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = [
	"rustls", "json",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
flate2 = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"

[dev-dependencies]
proptest = "1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
wasmparser = { version = "=0.259.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
window-vibrancy = "0.8"
windows-sys = { version = "0.61", features = [
	"Wdk_System_SystemServices",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_Pipes",
	"Win32_System_SystemInformation",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
