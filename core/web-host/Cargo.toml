[package]
name = "keencode-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false
description = "KeenCode local Web transport, authentication and authorized resource serving"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "original-uri", "tokio", "ws"] }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
keencode-acp = { path = "../acp" }
percent-encoding = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
