[package]
name = "keencode-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "KeenCode JSON workflow definition, validation, execution, and recovery domain"

[lib]
name = "keencode_workflow"
path = "src/lib.rs"

[dependencies]
# 使用现有仓库统一的强类型 JSON 定义与事件编码。
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
# 定义稳定的工作流与输入摘要，恢复时拒绝不一致定义。
sha2 = "0.10.9"
# 提供异步取消、并发闸门和有界运行时钟。
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
