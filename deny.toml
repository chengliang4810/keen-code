# cargo-deny 供应链审计配置；CI 执行：
#   cargo deny check advisories bans licenses sources
# 依赖来源和许可证以当前 Cargo.lock 为准；固定 Git revision 是必要条件。

[advisories]
yanked = "deny"
# 这些条目来自当前锁文件中的未维护或暂时无法升级的传递依赖。每次锁文件更新都应
# 重新检查它们是否仍然可达，并在上游提供替代版本后删除对应例外。
ignore = [
  # Windows 生产 PTY 路径：serial 0.4.0 <- portable-pty 0.8.1；当前 advisory 无安全升级。
  "RUSTSEC-2017-0008",
  # 全目标图的 Linux 无障碍路径：quick-xml 0.38.4 <- zbus_xml <- atspi/accesskit_unix
  # <- gpui_linux；Windows MSVC 生产图不包含该链，待上游兼容 quick-xml >= 0.41.0。
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # Windows 生产图的 GPUI 图形路径：paste 1.0.15 <- pulp <- exr <- image；当前 advisory 无安全升级。
  "RUSTSEC-2024-0436",
  # Windows 生产图的 GPUI 字体路径：ttf-parser 0.25.1 <- fontdb/usvg <- gpui_windows；待上游迁移。
  "RUSTSEC-2026-0192",
  # Windows 生产图的 GPUI 字体路径：rustybuzz 0.20.1 <- usvg <- gpui_windows；待上游迁移。
  "RUSTSEC-2026-0206",
]

[bans]
# GPUI 及其跨平台依赖会带来少量并行版本；先记录告警，按上游兼容版本逐步收敛。
multiple-versions = "warn"

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"

# 直接和传递 Git 依赖均必须落在固定来源；revision 由 Cargo.lock 记录。
allow-git = [
  "https://github.com/zed-industries/zed",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/wasm_thread",
]
